<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>
        <link rel="stylesheet" href="login.css" />
        <link rel="icon" href="image/logo.png" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@400..900&family=Great+Vibes&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;700&family=Parisienne&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div>
            <div class="display">
                <section class="left-page">
                    <img src="image/login/login.jpeg" alt="" />
                    <a class="logo" href="index.html">
                        <img src="image/logo.png" alt="" />
                        <h1>Physics Universe</h1>
                    </a>
                </section>

                <section class="right-page">
                    <div class="top">
                        <h1>Sign in to Physics <br />Universe</h1>
                        <p>Welcome back! Please sign in to continue</p>
                    </div>

                    <div class="mid">
                        <div class="icon">
                            <a href=""><img src="image/login/apple.png" alt="" /> Apple</a>
                            <a href=""><img src="image/login/google.png" alt="" /> Google</a>
                        </div>

                        <p>or</p>
                    </div>

                    <form class="last" action="">
                        <label for="email">Email address</label>
                        <input id="email" type="text" name="email" placeholder="Enter your emaila address" />

                        <label class="password" for="password">Password</label>
                        <input id="password" type="password" name="password" placeholder="●●●●●●●●●●●" />

                        <a href="dashboard.html">Login</a>
                    </form>

                    <div class="sign-up">Don't have an account? <a href="signup.html">Sign Up</a></div>

                    <div class="terms">
                        <a href="index.html">Home</a>
                        <p>|</p>
                        <a href="">Contact</a>
                        <p>|</p>
                        <a href="">Terms</a>
                    </div>

                    <div class="footer-logo">
                        <a href="index.html"><img src="image/logo.png" alt="" /></a>
                    </div>
                </section>
            </div>
        </div>
    </body>
</html>
